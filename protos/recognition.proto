syntax = "proto3";

package recognition;

service RecognitionService {
  // Fire-and-forget face identification
  rpc IdentifyFace (FaceIdentificationRequest) returns (FaceIdentificationResponse);

  // Get cached tracking info for a detect_id (replaces HTTP call to database_service)
  rpc GetTrackingInfo (TrackingInfoRequest) returns (TrackingInfoResponse);
}

message FaceIdentificationRequest {
  int32 detect_id = 1;
  string camera_id = 2;
  bytes origin_image = 3;    // JPEG-encoded full frame
  bytes detect_image = 4;    // JPEG-encoded person crop
  bytes face_image = 5;      // JPEG-encoded face crop (empty bytes = not available)
}

message FaceIdentificationResponse {
  bool success = 1;
  string message = 2;
}

message TrackingInfoRequest {
  int32 detect_id = 1;
}

message TrackingInfoResponse {
  bool found = 1;
  string user_name = 2;
  bool is_unknown = 3;
}
