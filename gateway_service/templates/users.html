{% extends "base.html" %}

{% block title %}User Management{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12 mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2>User Management</h2>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
                Add User
            </button>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>User ID</th>
                                <th>Name</th>
                                <th>Images</th>
                                <th>Last Detection</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="userList">
                            <!-- User data will be dynamically added here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add User Modal -->
<div class="modal fade" id="addUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addUserForm">
                    <div class="mb-3">
                        <label for="userName" class="form-label">User Name</label>
                        <input type="text" class="form-control" id="userName" required>
                    </div>
                    <div class="mb-3">
                        <label for="userIdentifier" class="form-label">Identifier</label>
                        <input type="text" class="form-control" id="userIdentifier" required>
                    </div>
                    <div class="mb-3">
                        <label for="userImage" class="form-label">Face Image</label>
                        <input type="file" class="form-control" id="userImage" accept="image/*" required>
                    </div>
                    <div class="mb-3">
                        <img id="imagePreview" class="img-fluid d-none" alt="Preview">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="submitUser">Add User</button>
            </div>
        </div>
    </div>
</div>

<!-- View User Images Modal -->
<div class="modal fade" id="viewUserModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">User Images</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row" id="userImages">
                    <!-- User images will be displayed here -->
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    loadUsers();

    // Image preview
    $('#userImage').change(function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                $('#imagePreview').attr('src', e.target.result).removeClass('d-none');
            }
            reader.readAsDataURL(file);
        }
    });

    // Handle user form submission
    $('#submitUser').click(function() {
        const formData = new FormData();
        formData.append('identifier', $('#userIdentifier').val());
        formData.append('user_name', $('#userName').val());
        formData.append('file', $('#userImage')[0].files[0]);

        $.ajax({
            url: '/api/users/upload',
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function(response) {
                $('#addUserModal').modal('hide');
                loadUsers();
                $('#addUserForm')[0].reset();
                $('#imagePreview').addClass('d-none');
            },
            error: function(error) {
                alert('Error adding user');
            }
        });
    });
});

function loadUsers() {
    $.get('/api/users/list', function(users) {
        const userList = $('#userList');
        userList.empty();

        users.forEach(user => {
            const row = `
                <tr>
                    <td>${user.identifier}</td>
                    <td>${user.username}</td>
                    <td>
                        <button class="btn btn-info btn-sm" onclick="viewUserImages('${user._id}')">
                            View Images (${user.face_images_path?.length || 0})
                        </button>
                    </td>
                    <td>${user.last_detection || 'Never'}</td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="deleteUser('${user._id}')">Delete</button>
                        <button class="btn btn-primary btn-sm" onclick="editUser('${user._id}')">Edit</button>
                    </td>
                </tr>
            `;
            userList.append(row);
        });
    });
}

function viewUserImages(userId) {
    $.get(`/api/users/${userId}/images`, function(images) {
        const imageContainer = $('#userImages');
        imageContainer.empty();

        images.forEach(imagePath => {
            const image = `
                <div class="col-md-4 mb-3">
                    <img src="/static/${imagePath}" class="img-fluid" alt="User Image">
                </div>
            `;
            imageContainer.append(image);
        });

        $('#viewUserModal').modal('show');
    });
}

function deleteUser(userId) {
    if (confirm('Are you sure you want to delete this user?')) {
        $.ajax({
            url: `/api/users/${userId}`,
            type: 'DELETE',
            success: function() {
                loadUsers();
            },
            error: function() {
                alert('Error deleting user');
            }
        });
    }
}

function editUser(userId) {
    // Implement edit user functionality
}
</script>
{% endblock %}
